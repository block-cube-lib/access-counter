[package]
name = "access-counter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A tiny, privacy-first access counter / pageview analytics worker for static sites (Cloudflare Workers + D1, written in Rust)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
